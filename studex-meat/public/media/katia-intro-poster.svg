<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Katia — Chief of Staff, StudEx Meat">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0B4F3C" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#0B4F3C" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0B4F3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0d0f0e"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- faint circuit traces -->
  <g stroke="#C9A84C" stroke-opacity=".16" stroke-width="1.5" fill="none">
    <path d="M0 520 H210 l40 -40 H430"/>
    <path d="M0 580 H150 l30 -30 H360"/>
    <path d="M1280 200 H1080 l-40 -40 H860"/>
    <path d="M1280 260 H1120 l-30 -30 H900"/>
    <path d="M420 720 V620 l35 -35 H620"/>
    <path d="M980 720 V640 l-30 -30 H800"/>
  </g>
  <g fill="#C9A84C" fill-opacity=".26">
    <circle cx="210" cy="520" r="4"/><circle cx="150" cy="580" r="4"/>
    <circle cx="1080" cy="200" r="4"/><circle cx="1120" cy="260" r="4"/>
    <circle cx="420" cy="620" r="4"/><circle cx="980" cy="640" r="4"/>
  </g>

  <!-- the frame's left edge: the emerald-gold rule -->
  <rect x="86" y="196" width="3" height="238" fill="url(#edge)"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="126" y="246" fill="#C9A84C" font-size="19" letter-spacing="6.5" font-weight="600">MEET THE CREW</text>
    <text x="126" y="330" fill="#f5f3ed" font-size="60" font-weight="700" letter-spacing="-1.2">Katia</text>
    <text x="126" y="372" fill="#d8d5cb" font-size="27" font-weight="400">Chief of Staff, StudEx Meat</text>
    <text x="126" y="424" fill="#8f8d85" font-size="20" font-weight="400">The first AI-operated meat brand.</text>
  </g>

  <!-- play affordance -->
  <g opacity=".9">
    <circle cx="1130" cy="360" r="46" fill="#0B4F3C" fill-opacity=".55" stroke="#C9A84C" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M1118 338 L1118 382 L1154 360 Z" fill="#C9A84C"/>
  </g>
</svg>
